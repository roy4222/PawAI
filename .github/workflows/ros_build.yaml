name: ROS2 CI

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

# CI-05: least-privilege GITHUB_TOKEN — no job here writes to the repo.
permissions:
  contents: read

jobs:
  # ── Tier 1: Fast Gate (< 1 min, no ROS2 container) ──────────────
  fast-gate:
    name: Fast Gate (lint + pure-python tests)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Guard hook regression (secret guards + injection)
        run: bash scripts/hooks/test_secret_guards.sh
      - name: Install dependencies
        run: pip install pytest pytest-cov flake8 numpy opencv-python-headless jsonschema pyyaml requests langgraph click python-dotenv
      - name: Flake8 lint (report-only)
        run: |
          flake8 speech_processor/ go2_robot_sdk/ face_perception/ \
            vision_perception/ benchmarks/ \
            --max-line-length=100 --extend-ignore=E203 --max-complexity=10 \
            --exit-zero
      - name: Flake8 blocking on newly-added core Python
        run: |
          git fetch origin main --quiet 2>/dev/null || true
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1)
          NEW=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- 'benchmarks/core/*.py' 'pawai_brain/**/*.py' 'tools/pawai_cli/**/*.py' || true)
          if [ -n "$NEW" ]; then
            echo "Linting newly-added core files (blocking):"; echo "$NEW"
            flake8 $NEW --max-line-length=100 --extend-ignore=E203 --max-complexity=10
          else
            echo "No newly-added core Python files to lint."
          fi
      - name: Pure Python unit tests (no ROS2 needed)
        run: |
          # Invocation 1: existing modules + scoreboard core (default import mode, unchanged)
          PYTHONPATH=speech_processor:vision_perception:benchmarks pytest \
            speech_processor/test/test_speech_test_observer.py \
            speech_processor/test/test_intent_classifier.py \
            speech_processor/test/test_llm_contract.py \
            vision_perception/test/test_gesture_classifier.py \
            vision_perception/test/test_pose_classifier.py \
            vision_perception/test/test_event_builder.py \
            vision_perception/test/test_interaction_rules.py \
            vision_perception/test/test_event_action_bridge.py \
            vision_perception/test/test_mediapipe_pose_mapping.py \
            vision_perception/test/test_gesture_recognizer_backend.py \
            vision_perception/test/test_lidar_obstacle_detector.py \
            vision_perception/test/test_obstacle_detector.py \
            benchmarks/test/test_criteria.py \
            benchmarks/test/test_base_adapter.py \
            benchmarks/test/test_reporter.py \
            benchmarks/test/test_runner.py \
            benchmarks/test/test_monitor.py \
            benchmarks/test/test_scoreboard_schema.py \
            benchmarks/test/test_grader.py \
            benchmarks/test/test_scoreboard.py \
            benchmarks/test/test_build_scoreboard.py \
            benchmarks/test/test_perception_baseline_observer.py \
            benchmarks/test/test_face_baseline_observer.py \
            benchmarks/test/test_readiness.py \
            benchmarks/test/test_run_preflight.py \
            benchmarks/test/test_voice_csv_to_jsonl.py \
            benchmarks/test/test_capture_baseline_round.py \
            -v --tb=short \
            --cov=speech_processor/speech_processor \
            --cov=vision_perception/vision_perception \
            --cov=benchmarks \
            --cov-report=term --cov-report=xml:coverage.xml
          # Invocation 2: pawai_brain pure-Python tests (17 files, Tier 1) in an isolated
          # PYTHONPATH to avoid the duplicate top-level 'test' package collision with
          # speech_processor/test. Excluded (local-only, rclpy via conversation_graph_node):
          # test_conversation_graph_node.py, test_user_message_builder.py.
          # pawai_contracts prefix: skill_policy_gate imports from it (Plan C4).
          PYTHONPATH=pawai_contracts:pawai_brain pytest \
            pawai_brain/test/test_capability_builder_node.py \
            pawai_brain/test/test_capability_health_gate.py \
            pawai_brain/test/test_capability_registry.py \
            pawai_brain/test/test_demo_guides_loader.py \
            pawai_brain/test/test_demo_policy_loader.py \
            pawai_brain/test/test_effective_status.py \
            pawai_brain/test/test_graph_smoke.py \
            pawai_brain/test/test_health_loader.py \
            pawai_brain/test/test_llm_client_offline.py \
            pawai_brain/test/test_mode_classifier.py \
            pawai_brain/test/test_response_repair.py \
            pawai_brain/test/test_skill_policy_gate.py \
            pawai_brain/test/test_skill_result_memory.py \
            pawai_brain/test/test_skill_result_subscription.py \
            pawai_brain/test/test_validator.py \
            pawai_brain/test/test_world_snapshot.py \
            pawai_brain/test/test_world_state_builder.py \
            -v --tb=short
          # Invocation 3 (2026-06-10 Plan A, Tier 1): interaction_executive —
          # CI-safe subset only. Excluded from CI, run locally instead: 4 files
          # importing rclpy directly (attention_integration / brain_rules /
          # mini_e2e / nav_executor) + 3 files needing ROS modules anyway
          # (idle_mvp: rclpy via brain_node; safety_layer: rclpy via
          # world_state; world_state: std_msgs direct + rclpy via
          # world_state module). See docs/superpowers/plans/
          # 2026-06-10-plan-a-ci-guardrails.md. Isolated PYTHONPATH avoids the
          # top-level 'test' package collision. pawai_contracts prefix: the
          # skill_contract compat shim imports from it (Plan C2).
          PYTHONPATH=pawai_contracts:interaction_executive pytest \
            interaction_executive/test/test_attention_machine.py \
            interaction_executive/test/test_pending_confirm.py \
            interaction_executive/test/test_perception_router.py \
            interaction_executive/test/test_interaction_state.py \
            interaction_executive/test/test_skill_contract.py \
            interaction_executive/test/test_skill_contract_demo_fields.py \
            interaction_executive/test/test_skill_queue.py \
            interaction_executive/test/test_state_machine.py \
            -v --tb=short
          # Invocation 4 (Plan A2, Tier 1): pawai_cli — mock-based CLI tests.
          # PYTHONPATH needed: the package is not pip-installed on the runner.
          # tests/ dir name avoids the top-level 'test' package collision.
          PYTHONPATH=tools/pawai_cli pytest tools/pawai_cli/tests -v --tb=short
          # Invocation 5 (Plan A5, Tier 2): nav_capability pure-lib tests.
          # NEVER add test/integration/ — test_mux_priority drives a real
          # 0.30 m/s through the mux (2026-04-26 runaway incident).
          # Dir-based collection: any NEW test file added here that imports
          # rclpy will be auto-collected and fail on this runner — keep rclpy
          # tests in integration/ (never automated) or switch to a file list.
          PYTHONPATH=nav_capability pytest nav_capability/test/ \
            --ignore=nav_capability/test/integration -v --tb=short
          # Invocation 6 (Plan A5, Tier 2): go2_robot_sdk safety-critical pure tests.
          # test_import.py excluded (aioice guard SystemExit on non-colcon env);
          # test_reactive_stop_node.py excluded (rclpy — local L1 tier).
          PYTHONPATH=go2_robot_sdk pytest \
            go2_robot_sdk/test/test_robot_control_service.py \
            go2_robot_sdk/test/test_reactive_stop_release_gate.py \
            go2_robot_sdk/test/test_depth_geometry.py \
            -v --tb=short
          # Invocation 7 (Plan C5, Tier 1): pawai_contracts purity + parity tests.
          # object_perception on the path for the zh parity test (coco_classes
          # is a pure dict module, no ROS imports).
          PYTHONPATH=pawai_contracts:object_perception pytest pawai_contracts/test/ \
            -v --tb=short
          # Invocation 8 (S0 hardening, Tier 1): gateway auth primitives (ROS-free).
          # + trace_store (Evidence Center T2B-1, 2026-06-12): pure-module JSONL
          # persistence / retention / PII redaction tests, same ROS-free tier.
          PYTHONPATH=pawai-studio/gateway pytest pawai-studio/gateway/test_auth.py \
            pawai-studio/gateway/test_trace_store.py \
            -v --tb=short
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
      - name: Python syntax check
        run: |
          find . -name '*.py' \
            -not -path './build/*' -not -path './install/*' -not -path './log/*' \
            -not -path './.git/*' -not -path '*/node_modules/*' \
            -print0 | xargs -0 -r python3 -m py_compile
          echo "All Python files pass syntax check."
      - name: Topic contract check
        run: python scripts/ci/check_topic_contracts.py

  # ── Tier 2: ROS2 Build + colcon test (< 5 min) ─────────────────
  test_environment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distribution:
          - humble
        include:
          # Humble Hawksbill (May 2022 - May 2027)
          - docker_image: rostooling/setup-ros-docker:ubuntu-jammy-ros-humble-ros-base-latest
            ros_distribution: humble
            ros_version: 2
    container:
      image: ${{ matrix.docker_image }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install libunwind (fix issues on humble)
        run: |
          (sudo apt update && sudo apt install --no-install-recommends libunwind-dev -y) || \
          (apt update && apt install --no-install-recommends libunwind-dev -y) || true
      - name: Install Python dependencies
        run: |
          pip3 install wasmtime aiortc aiohttp cryptography pydub pycryptodome || \
          pip3 install --break-system-packages wasmtime aiortc aiohttp cryptography pydub pycryptodome || true
      - name: build and test
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          target-ros2-distro: ${{ matrix.ros_distribution }}
          vcs-repo-file-url: ""
          skip-tests: false
          # TEMPORARY: scope to core packages only — go2_robot_sdk/lidar_processor_cpp
          # have heavy deps (nav2, PCL, foxglove_bridge) that fail in CI container.
          # TODO: fix rosdep keys or add a separate heavy-deps CI job.
          package-name: >-
            go2_interfaces
            pawai_contracts
            speech_processor
            face_perception
            vision_perception
      - name: Studio gateway tests (needs rclpy — Plan A4, Tier 1)
        run: |
          # ffmpeg: asr_client.resample_to_wav16k shells out to it; the
          # rostooling image doesn't bundle it (TestResampleAudio needs it).
          (sudo apt update && sudo apt install --no-install-recommends ffmpeg -y) || \
          (apt update && apt install --no-install-recommends ffmpeg -y) || true
          pip3 install -r pawai-studio/gateway/requirements.txt 'pytest>=7,<8' \
            opencv-python-headless numpy pydub || \
          pip3 install --break-system-packages -r pawai-studio/gateway/requirements.txt \
            'pytest>=7,<8' opencv-python-headless numpy pydub
          # pytest<8: with ROS sourced the humble launch_testing plugin family
          # (launch_testing + launch_testing_ros_pytest_entrypoint) auto-loads and
          # is incompatible with pytest>=8 (PluginValidationError on its makemodule
          # hookspec, aborting collection). Pin <8 = pre-pytest-8 known-good;
          # these plain FastAPI/pytest unit tests are unaffected.
          bash -c "source /opt/ros/humble/setup.bash && \
            cd pawai-studio/gateway && python3 -m pytest -q --tb=short"
      - name: object_perception tests (needs ROS msgs — Plan A5, Tier 2)
        run: |
          # Plan's fast-gate placement was unimplementable: the test module
          # imports std_msgs + ObjectPerceptionNode (rclpy) at module level.
          # onnxruntime / cv_bridge are lazy imports — not needed for tests.
          # No rclpy.init() needed: tests use @staticmethod calls and a
          # __new__ bypass, so importable ROS modules suffice (no DDS daemon).
          pip3 install 'pytest>=7,<8' opencv-python-headless numpy || \
          pip3 install --break-system-packages 'pytest>=7,<8' opencv-python-headless numpy
          # pytest<8: same humble launch_testing-vs-pytest8 incompatibility as
          # the gateway step (ROS-sourced pytest); pin restores known-good.
          bash -c "source /opt/ros/humble/setup.bash && \
            PYTHONPATH=\"object_perception:\$PYTHONPATH\" \
            python3 -m pytest object_perception/test/ -q --tb=short"
      - name: Python syntax check
        run: |
          find . -name '*.py' \
            -not -path './build/*' -not -path './install/*' -not -path './log/*' \
            -not -path './.git/*' -not -path '*/node_modules/*' \
            -print0 | xargs -0 -r python3 -m py_compile
          echo "All Python files pass syntax check."
