name: ROS2 CI

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

jobs:
  # ── Tier 1: Fast Gate (< 1 min, no ROS2 container) ──────────────
  fast-gate:
    name: Fast Gate (lint + pure-python tests)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pytest pytest-cov flake8 numpy opencv-python-headless jsonschema
      - name: Flake8 lint (report-only)
        run: |
          flake8 speech_processor/ go2_robot_sdk/ face_perception/ \
            vision_perception/ benchmarks/ \
            --max-line-length=100 --extend-ignore=E203 --max-complexity=10 \
            --exit-zero
      - name: Flake8 blocking on newly-added core Python
        run: |
          git fetch origin main --quiet 2>/dev/null || true
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1)
          NEW=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- 'benchmarks/core/*.py' 'pawai_brain/**/*.py' 'tools/pawai_cli/**/*.py' || true)
          if [ -n "$NEW" ]; then
            echo "Linting newly-added core files (blocking):"; echo "$NEW"
            flake8 $NEW --max-line-length=100 --extend-ignore=E203 --max-complexity=10
          else
            echo "No newly-added core Python files to lint."
          fi
      - name: Pure Python unit tests (no ROS2 needed)
        run: |
          # Invocation 1: existing modules + scoreboard core (default import mode, unchanged)
          PYTHONPATH=speech_processor:vision_perception:benchmarks pytest \
            speech_processor/test/test_speech_test_observer.py \
            speech_processor/test/test_intent_classifier.py \
            speech_processor/test/test_llm_contract.py \
            vision_perception/test/test_gesture_classifier.py \
            vision_perception/test/test_pose_classifier.py \
            vision_perception/test/test_event_builder.py \
            vision_perception/test/test_interaction_rules.py \
            vision_perception/test/test_event_action_bridge.py \
            vision_perception/test/test_mediapipe_pose_mapping.py \
            vision_perception/test/test_gesture_recognizer_backend.py \
            benchmarks/test/test_criteria.py \
            benchmarks/test/test_base_adapter.py \
            benchmarks/test/test_reporter.py \
            benchmarks/test/test_runner.py \
            benchmarks/test/test_monitor.py \
            benchmarks/test/test_scoreboard_schema.py \
            benchmarks/test/test_grader.py \
            benchmarks/test/test_scoreboard.py \
            benchmarks/test/test_build_scoreboard.py \
            benchmarks/test/test_perception_baseline_observer.py \
            benchmarks/test/test_face_baseline_observer.py \
            benchmarks/test/test_readiness.py \
            benchmarks/test/test_run_preflight.py \
            benchmarks/test/test_voice_csv_to_jsonl.py \
            -v --tb=short \
            --cov=speech_processor/speech_processor \
            --cov=vision_perception/vision_perception \
            --cov=benchmarks \
            --cov-report=term --cov-report=xml:coverage.xml
          # Invocation 2: pawai_brain pure-Python tests in an isolated PYTHONPATH to avoid
          # the duplicate top-level 'test' package collision with speech_processor/test
          PYTHONPATH=pawai_brain pytest \
            pawai_brain/test/test_effective_status.py \
            pawai_brain/test/test_mode_classifier.py \
            pawai_brain/test/test_response_repair.py \
            pawai_brain/test/test_skill_policy_gate.py \
            pawai_brain/test/test_skill_result_memory.py \
            pawai_brain/test/test_skill_result_subscription.py \
            pawai_brain/test/test_validator.py \
            pawai_brain/test/test_world_snapshot.py \
            pawai_brain/test/test_world_state_builder.py \
            -v --tb=short
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
      - name: Python syntax check
        run: |
          find . -name '*.py' \
            -not -path './build/*' -not -path './install/*' -not -path './log/*' \
            -not -path './.git/*' -not -path '*/node_modules/*' \
            -print0 | xargs -0 -r python3 -m py_compile
          echo "All Python files pass syntax check."
      - name: Topic contract check
        run: python scripts/ci/check_topic_contracts.py

  # ── Tier 2: ROS2 Build + colcon test (< 5 min) ─────────────────
  test_environment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distribution:
          - humble
        include:
          # Humble Hawksbill (May 2022 - May 2027)
          - docker_image: rostooling/setup-ros-docker:ubuntu-jammy-ros-humble-ros-base-latest
            ros_distribution: humble
            ros_version: 2
    container:
      image: ${{ matrix.docker_image }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install libunwind (fix issues on humble)
        run: |
          (sudo apt update && sudo apt install --no-install-recommends libunwind-dev -y) || \
          (apt update && apt install --no-install-recommends libunwind-dev -y) || true
      - name: Install Python dependencies
        run: |
          pip3 install wasmtime aiortc aiohttp cryptography pydub pycryptodome || \
          pip3 install --break-system-packages wasmtime aiortc aiohttp cryptography pydub pycryptodome || true
      - name: build and test
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          target-ros2-distro: ${{ matrix.ros_distribution }}
          vcs-repo-file-url: ""
          skip-tests: false
          # TEMPORARY: scope to core packages only — go2_robot_sdk/lidar_processor_cpp
          # have heavy deps (nav2, PCL, foxglove_bridge) that fail in CI container.
          # TODO: fix rosdep keys or add a separate heavy-deps CI job.
          package-name: >-
            go2_interfaces
            speech_processor
            face_perception
            vision_perception
      - name: Python syntax check
        run: |
          find . -name '*.py' \
            -not -path './build/*' -not -path './install/*' -not -path './log/*' \
            -not -path './.git/*' -not -path '*/node_modules/*' \
            -print0 | xargs -0 -r python3 -m py_compile
          echo "All Python files pass syntax check."
