# vision_perception/config/vision_perception.yaml
# Phase 1 defaults — no camera, mock inference
vision_perception_node:
  ros__parameters:
    inference_backend: "mock"
    use_camera: false
    publish_fps: 8.0
    tick_period: 0.05
    color_topic: "/camera/camera/color/image_raw"
    depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    # N7 (2026-05-11): user 反饋 fist 辨識率低。vote_frames 3→5 穩定 majority
    # 不受單幀 misdetection 影響；gesture_stable_s 0.5→0.3 縮短 hold gate 讓
    # fist 觸發更快（5 幀 @ 20Hz ≈ 250ms 投票 + 300ms hold = ~550ms 反應）。
    #
    # 2026-05-23 5/27 demo record mode (Roy 5/22 P0「狂誤觸」)
    # 拉到 vote=10 + stable=1.5 = 必須 ~3-4s 穩定姿勢才觸發
    # 對應 5/27 demo § 4：手勢只供 Studio trace 視覺化，不直接觸發 Go2 motion
    # 5/28+ 視 demo 拍完狀況決定是否 revert N7 baseline
    gesture_vote_frames: 10
    gesture_min_score: 0.1
    gesture_stable_s: 1.5
    gesture_backend: "rtmpose"    # "rtmpose" or "mediapipe"
    pose_backend: "rtmpose"       # "rtmpose" or "mediapipe"
    pose_complexity: 0            # 0=lite(fast), 1=full, 2=heavy
    max_hands: 1                  # 1=single(fast, default), 2=dual (launch override: max_hands:=2)
    hands_complexity: 0           # 0=lite(fast), 1=full
    gesture_every_n_ticks: 3      # run hands every N ticks (1=every, 3=skip 2)
    pose_vote_frames: 20
    mock_scenario: "standing_idle"
    # 2026-06-09 HITL demo-blocking 參數（Roy 拍板）— pose 事件全空 + 手勢誤觸修正。
    # 以下預設值 = 現行行為（不改變既有測試/行為）；demo 覆寫走
    # scripts/start_full_demo_tmux.sh launch args：
    #   pose_two_class:=true pose_min_avg_score:=0.15 sitting_trunk_max_deg:=45.0
    #   gesture_recognizer_min_conf:=0.7 gesture_min_votes:=3
    pose_min_avg_score: 0.2           # classify_pose 平均 keypoint 分數下限（低於 → None）
    sitting_trunk_max_deg: 35.0       # sitting 軀幹傾角上限（demo 放寬 45 接住彎腰/前傾坐姿）
    pose_two_class: false             # true = 只發 sitting/standing（蹲/跪/彎腰→坐；fallen 不發）
    gesture_recognizer_min_conf: 0.0  # recognizer 手勢分類信心門檻（demo 0.7 防 OK/誤觸）
    gesture_min_votes: 1              # 投票贏家最低票數（demo 3 = N3 stable-frame 投票）
